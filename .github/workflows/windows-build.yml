name: Windows build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B out/build -A x64

      - name: Build Debug
        run: cmake --build out/build --config Debug --parallel

      - name: Test Debug
        run: ctest --test-dir out/build -C Debug --output-on-failure

      - name: Build Release
        run: cmake --build out/build --config Release --parallel

      - name: Test Release
        run: ctest --test-dir out/build -C Release --output-on-failure

  bruneton_reference_tool:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure reference comparator
        run: cmake -S . -B out/reference -A x64 -DDESKTOPWORLD_BUILD_BRUNETON_COMPARATOR=ON

      - name: Build reference comparator
        run: cmake --build out/reference --config Release --target bruneton_reference_compare --parallel
